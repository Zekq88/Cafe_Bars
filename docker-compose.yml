services:
  frontend:
    build:
      context: ./frontend
    container_name: cafe-bars-frontend
    ports:
      - 8090:80
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: cafe-bars-backend
    ports:
      - "3000:3000"

  mongo:
    image: mongo:7
    container_name: cafe-bars-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
